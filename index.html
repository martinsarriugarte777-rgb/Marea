<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marea</title>
<meta name="theme-color" content="#0d1b2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral + contenido desplazable + reproductor fijo abajo; en móvil, pestañas inferiores y mini reproductor */
:root{
  --bg:#0d1b2a; --surface:#13263a; --surface-2:#1a3149; --line:#24405c;
  --fg:#eaf2f8; --muted:#8fa7bd; --accent:#ff7a6b; --accent-ink:#2a0d09; --live:#3ddc97;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f7fa; --surface:#ffffff; --surface-2:#e6eef4; --line:#d3dfe8;
  --fg:#0d1b2a; --muted:#56708a; --accent:#e5533f; --accent-ink:#ffffff; --live:#12935e; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f3f7fa; --surface:#ffffff; --surface-2:#e6eef4; --line:#d3dfe8;
  --fg:#0d1b2a; --muted:#56708a; --accent:#e5533f; --accent-ink:#ffffff; --live:#12935e; color-scheme:light }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:inherit}
input,select{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
svg{width:20px;height:20px;fill:currentColor;flex:none}

.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:1fr auto;height:100%}
.side{grid-row:1;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.logo{font:800 28px/1 var(--display);letter-spacing:-.02em;padding:0 12px 20px;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--accent),transparent 70%),var(--surface-2);display:block}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:500;text-align:left;width:100%}
.nav:hover{color:var(--fg);background:var(--surface)}
.nav[aria-current="true"]{color:var(--fg);background:var(--surface-2)}
.side .note{margin-top:auto;font-size:12px;color:var(--muted);padding:12px;line-height:1.45}

main{grid-row:1;overflow-y:auto;padding-block:28px 40px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:32px;max-width:1200px}
h1{font:800 clamp(30px,4vw,46px)/1.05 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance}
h2{font:700 21px/1.2 var(--display);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
section{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:500}
.chip:hover{background:var(--line)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;padding:10px;border-radius:var(--r);min-width:0}
.card:hover{background:var(--surface)}
.cover{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;font:800 40px var(--display);color:var(--muted)}
.cover .go{position:absolute;right:8px;bottom:8px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:.18s}
.card:hover .go,.card:focus-visible .go{opacity:1;transform:none}
.card b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.list{display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:6px 10px;border-radius:8px}
.tr:hover{background:var(--surface)}
.tr.on .n,.tr.on .t b{color:var(--accent)}
.tr .n{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.tr img,.tr .sq{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--surface-2)}
.tr .t{min-width:0;display:flex;flex-direction:column;text-align:left}
.tr .t b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .t span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .d{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tr .acts{display:flex;gap:2px}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ib:hover{color:var(--fg);background:var(--surface-2)}
.ib.liked{color:var(--accent)}

.tag{font-style:normal;line-height:1.5;display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;vertical-align:middle}
.tag.preview{background:var(--surface-2);color:var(--muted)}
.tag.free{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.tag.live{background:color-mix(in srgb,var(--live) 18%,transparent);color:var(--live)}

.searchbar{display:flex;gap:10px;max-width:640px}
.searchbar input{flex:1;min-width:0;padding:13px 20px;font-size:16px}
.btn{padding:10px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.empty{color:var(--muted);padding:24px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.skel{height:220px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend div{display:flex;gap:8px;align-items:center}

/* Reproductor */
.player{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:20px;
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  background:var(--surface);border-top:1px solid var(--line)}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.now img,.now .sq{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--surface-2);flex:none}
.now .t{min-width:0}
.now .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.now .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.btns{display:flex;align-items:center;gap:10px}
.play{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.play:hover{transform:scale(1.05)}
.prog{display:flex;align-items:center;gap:10px;width:100%;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;flex:1;height:16px;border-radius:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fg) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fg);margin-top:-4px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--fg)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--fg)}
.extra{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.extra input{max-width:110px}
.full{font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.full a{text-decoration:underline;text-underline-offset:2px}
.full a:hover{color:var(--fg)}

.tabs{display:none}

/* Panel de cola y diálogo */
.drawer{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:110px;width:min(380px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);z-index:20}
.modal{position:fixed;inset:0;background:rgba(5,12,20,.6);display:grid;place-items:center;z-index:30;padding:16px}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.modal .box button.opt{text-align:left;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.modal .box button.opt:hover{background:var(--line)}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;z-index:40}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto auto}
  .side{display:none}
  main{padding-block:20px 24px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .player{grid-row:2;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding-block:8px}
  .player .ctl{grid-column:1/-1;grid-row:2;order:3}
  .player .extra .vol,.player .extra input{display:none}
  .player .btns .sm{display:none}
  .now img,.now .sq{width:44px;height:44px}
  .tabs{grid-row:3;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabs .nav{flex-direction:column;gap:2px;font-size:11px;padding:8px 2px;justify-content:center;text-align:center}
  .tabs .nav[aria-current="true"]{background:none;color:var(--accent)}
  .player{padding-bottom:8px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .tr{grid-template-columns:40px minmax(0,1fr) auto;gap:10px;padding:6px 4px}
  .tr .n,.tr .d{display:none}
  .drawer{bottom:150px}
  .toast{bottom:190px;max-width:calc(100vw - 32px);text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navegación">
    <div class="logo"><i></i>Marea</div>
    <nav id="sidenav"></nav>
    <p class="note">Sin anuncios y sin cuenta. Tus favoritos y listas se guardan en este navegador.</p>
  </aside>

  <main id="main"></main>

  <footer class="player" aria-label="Reproductor">
    <div class="now" id="now"><div class="sq"></div><div class="t"><b>Elige algo para escuchar</b><span>Canciones, emisoras o música libre</span></div></div>
    <div class="ctl">
      <div class="btns">
        <button class="ib sm" id="bShuffle" aria-label="Aleatorio" title="Aleatorio"><svg viewBox="0 0 24 24"><path d="M10.6 9.2 5.4 4 4 5.4l5.2 5.2 1.4-1.4ZM14.5 4l2 2L4 18.6 5.4 20 18 7.5l2 2V4h-5.5Zm.3 9.4-1.4 1.4 3.1 3.1-2 2.1H20v-5.5l-2 2-3.2-3.1Z"/></svg></button>
        <button class="ib" id="bPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6Zm3.5 6 8.5 6V6l-8.5 6Z"/></svg></button>
        <button class="play" id="bPlay" aria-label="Reproducir"><svg viewBox="0 0 24 24" id="icPlay"><path d="M8 5v14l11-7L8 5Z"/></svg></button>
        <button class="ib" id="bNext" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2V6ZM6 18l8.5-6L6 6v12Z"/></svg></button>
        <button class="ib sm" id="bRepeat" aria-label="Repetir" title="Repetir"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7Zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4Z"/></svg></button>
      </div>
      <div class="prog"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posición"><span id="tDur">0:00</span></div>
      <div class="full" id="full" hidden></div>
    </div>
    <div class="extra">
      <button class="ib" id="bLike" aria-label="Me gusta"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21Z"/></svg></button>
      <button class="ib" id="bQueue" aria-label="Cola de reproducción"><svg viewBox="0 0 24 24"><path d="M3 6h13v2H3V6Zm0 5h13v2H3v-2Zm0 5h9v2H3v-2Zm15-2.5V20l4-3.2-4-3.3Z"/></svg></button>
      <svg class="vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z"/></svg>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volumen">
    </div>
  </footer>

  <nav class="tabs" id="tabnav" aria-label="Secciones"></nav>
</div>
<audio id="audio" preload="none"></audio>
<div id="layer"></div>

<script>
/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { if (!isFinite(s) || s < 0) return '0:00'; s = Math.floor(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const ico = {
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6V5Zm8 0h4v14h-4V5Z"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21Z"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"/></svg>'
};
const NAV = [
  ['inicio','Inicio','<svg viewBox="0 0 24 24"><path d="M12 3 3 10v11h6v-6h6v6h6V10l-9-7Z"/></svg>'],
  ['buscar','Buscar','<svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>'],
  ['radio','Radio','<svg viewBox="0 0 24 24"><path d="M12 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4ZM6.3 6.3l1.4 1.4a6 6 0 0 0 0 8.6l-1.4 1.4a8 8 0 0 1 0-11.4Zm11.4 0a8 8 0 0 1 0 11.4l-1.4-1.4a6 6 0 0 0 0-8.6l1.4-1.4ZM3.5 3.5l1.4 1.4a10 10 0 0 0 0 14.2l-1.4 1.4a12 12 0 0 1 0-17Zm17 0a12 12 0 0 1 0 17l-1.4-1.4a10 10 0 0 0 0-14.2l1.4-1.4Z"/></svg>'],
  ['libre','Música libre','<svg viewBox="0 0 24 24"><path d="M9 3v10.6A4 4 0 1 0 11 17V7h6V3H9Z"/></svg>'],
  ['biblioteca','Biblioteca','<svg viewBox="0 0 24 24"><path d="M4 3h2v18H4V3Zm4 0h2v18H8V3Zm4.4 1.2 1.9-.6 5.6 16.9-1.9.6-5.6-16.9Z"/></svg>']
];

function jsonp(url, ms = 12000) {
  return new Promise((res, rej) => {
    const cb = 'cb' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); rej(new Error('timeout')); }, ms);
    window[cb] = d => { done(); res(d); };
    s.onerror = () => { done(); rej(new Error('red')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}
async function getJSON(url, ms = 12000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}

/* ---------- Almacenamiento local ---------- */
const store = {
  key: 'marea:v1',
  load() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch { return {}; } },
  save() { try { localStorage.setItem(this.key, JSON.stringify({ likes: S.likes, lists: S.lists, recent: S.recent, country: S.country, vol: audio.volume })); } catch {} }
};
const saved = store.load();
const S = {
  view: 'inicio', likes: saved.likes || [], lists: saved.lists || [], recent: saved.recent || [],
  country: saved.country || 'es', queue: [], idx: -1, shuffle: false, repeat: false, q: '', cache: {}
};

/* ---------- Fuentes de música ---------- */
// 1) Catálogo mundial (iTunes Search): casi cualquier canción publicada, avance legal de 30 s.
const fromItunes = r => ({
  id: 'it' + r.trackId, kind: 'preview', title: r.trackName, artist: r.artistName, album: r.collectionName,
  art: (r.artworkUrl100 || '').replace('100x100bb', '600x600bb'), src: r.previewUrl, dur: 30,
  link: r.trackViewUrl, genre: r.primaryGenreName
});
async function searchSongs(term, limit = 40) {
  const d = await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&entity=song&limit=${limit}&country=${S.country}`);
  return (d.results || []).filter(r => r.previewUrl).map(fromItunes);
}
async function topSongs(cc) {
  try {
    const d = await getJSON(`https://rss.applemarketingtools.com/api/v2/${cc}/music/most-played/50/songs.json`);
    const ids = d.feed.results.map(r => r.id);
    const l = await jsonp(`https://itunes.apple.com/lookup?id=${ids.join(',')}&country=${cc}&entity=song`);
    const byId = new Map((l.results || []).filter(r => r.previewUrl).map(r => [String(r.trackId), r]));
    const out = ids.map(id => byId.get(id)).filter(Boolean).map(fromItunes);
    if (out.length) return out;
    throw new Error('vacío');
  } catch {
    return searchSongs('éxitos ' + new Date().getFullYear(), 40);
  }
}

// 2) Radio en directo (Radio Browser): más de 40.000 emisoras con licencia propia, música completa.
const RB = ['https://de1.api.radio-browser.info', 'https://fi1.api.radio-browser.info', 'https://nl1.api.radio-browser.info', 'https://at1.api.radio-browser.info'];
async function radio(params) {
  const qs = new URLSearchParams({ limit: 40, hidebroken: 'true', order: 'clickcount', reverse: 'true', ...params });
  for (const host of RB) {
    try {
      const d = await getJSON(`${host}/json/stations/search?${qs}`, 9000);
      return d.filter(s => s.url_resolved && (location.protocol !== 'https:' || s.url_resolved.startsWith('https:')))
        .map(s => ({ id: 'rb' + s.stationuuid, kind: 'live', title: s.name.trim(), artist: [s.country, (s.tags || '').split(',').slice(0, 2).join(', ')].filter(Boolean).join(' · '),
          art: s.favicon, src: s.url_resolved, link: s.homepage }));
    } catch {}
  }
  throw new Error('No se pudo contactar con el directorio de radios');
}

// 3) Música libre completa (Internet Archive, licencias Creative Commons).
async function freeAlbums(term, rows = 24) {
  const q = `(${term}) AND mediatype:(audio) AND collection:(netlabels OR opensource_audio) AND licenseurl:*`;
  const u = `https://archive.org/advancedsearch.php?q=${encodeURIComponent(q)}&fl[]=identifier&fl[]=title&fl[]=creator&rows=${rows}&sort[]=downloads+desc&output=json`;
  const d = await getJSON(u);
  return (d.response?.docs || []).map(x => ({ id: x.identifier, title: x.title, artist: [].concat(x.creator || 'Artista libre')[0], art: `https://archive.org/services/img/${x.identifier}` }));
}
async function albumTracks(a) {
  if (S.cache[a.id]) return S.cache[a.id];
  const m = await getJSON(`https://archive.org/metadata/${a.id}`);
  const files = (m.files || []).filter(f => /mp3/i.test(f.format || '') && !/64kb|sample/i.test(f.name));
  const tracks = files.sort((x, y) => (parseInt(x.track) || 0) - (parseInt(y.track) || 0) || x.name.localeCompare(y.name))
    .map((f, i) => ({ id: 'ia' + a.id + '/' + f.name, kind: 'free', title: f.title || f.name.replace(/\.mp3$/i, '').replace(/[_-]+/g, ' '),
      artist: f.artist || f.creator || a.artist, album: a.title, art: a.art,
      src: `https://archive.org/download/${a.id}/${encodeURIComponent(f.name)}`, dur: parseFloat(f.length) || 0, link: `https://archive.org/details/${a.id}` }));
  return (S.cache[a.id] = tracks);
}

const audio = $('#audio');

function playList(tracks, i) {
  S.queue = tracks.slice(); S.idx = i;
  load();
}
function load() {
  const t = S.queue[S.idx]; if (!t) return;
  audio.src = t.src; audio.play().catch(() => toast('No se pudo reproducir esta pista. Prueba con otra.'));
  S.recent = [t, ...S.recent.filter(x => x.id !== t.id)].slice(0, 20); store.save();
  renderNow(); markPlaying();
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album || '', artwork: t.art ? [{ src: t.art, sizes: '512x512' }] : [] });
  }
}
function renderNow() {
  const t = S.queue[S.idx]; if (!t) return;
  $('#now').innerHTML = `${art(t.art)}<div class="t"><b>${esc(t.title)}</b><span>${kindTag(t.kind)} ${esc(t.artist)}</span></div>`;
  $('#bLike').classList.toggle('liked', isLiked(t.id));
  const full = $('#full');
  if (t.kind === 'preview') {
    const q = encodeURIComponent(`${t.artist} ${t.title}`);
    full.innerHTML = `Canción completa en: <a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">YouTube</a><a href="${esc(t.link)}" target="_blank" rel="noopener">Apple Music</a>`;
    full.hidden = false;
  } else full.hidden = true;
  const live = t.kind === 'live';
  $('#seek').disabled = live; $('#tDur').textContent = live ? 'EN DIRECTO' : fmt(t.dur);

function markPlaying() {
  const id = S.queue[S.idx]?.id;
  main.querySelectorAll('[data-list]').forEach(l => {
    const arr = lists[l.dataset.list] || [];

  });
}
function next(auto = false) {
  if (!S.queue.length) return;
  if (auto && S.repeat) { audio.currentTime = 0; audio.play(); return; }
  if (S.shuffle && S.queue.length > 1) { let n; do n = Math.floor(Math.random() * S.queue.length); while (n === S.idx); S.idx = n; }
  else if (S.idx < S.queue.length - 1) S.idx++;
  else if (auto) return; else S.idx = 0;
  load();
}
function prev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (S.idx > 0) { S.idx--; load(); }
}
function toggle() {
  if (!audio.src) { const first = Object.values(lists).find(l => l.length && l[0].src); if (first) playList(first, 0); return; }
  audio.paused ? audio.play() : audio.pause();
}
audio.addEventListener('play', () => { $('#bPlay').innerHTML = ico.pause; $('#bPlay').setAttribute('aria-label', 'Pausar'); });
audio.addEventListener('pause', () => { $('#bPlay').innerHTML = ico.play; $('#bPlay').setAttribute('aria-label', 'Reproducir'); });
audio.addEventListener('ended', () => next(true));
audio.addEventListener('error', () => { if (audio.src) toast('Esta pista no está disponible. Pasando a la siguiente.'); setTimeout(() => next(true), 800); });
audio.addEventListener('loadedmetadata', () => { if (isFinite(audio.duration)) $('#tDur').textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  $('#tCur').textContent = fmt(audio.currentTime);
  if (isFinite(audio.duration) && audio.duration > 0) { const p = audio.currentTime / audio.duration; $('#seek').value = p * 1000; setRange($('#seek'), p); }
});
$('#seek').addEventListener('input', e => { if (isFinite(audio.duration)) audio.currentTime = e.target.value / 1000 * audio.duration; });
$('#vol').addEventListener('input', e => { audio.volume = e.target.value / 100; setRange(e.target, audio.volume); store.save(); });
$('#bPlay').onclick = toggle; $('#bNext').onclick = () => next(); $('#bPrev').onclick = prev;
$('#bShuffle').onclick = e => { S.shuffle = !S.shuffle; e.currentTarget.classList.toggle('liked', S.shuffle); toast(S.shuffle ? 'Aleatorio activado' : 'Aleatorio desactivado'); };
$('#bRepeat').onclick = e => { S.repeat = !S.repeat; e.currentTarget.classList.toggle('liked', S.repeat); toast(S.repeat ? 'Repetir canción activado' : 'Repetir desactivado'); };
$('#bLike').onclick = () => { const t = S.queue[S.idx]; if (t) like(t); };
$('#bQueue').onclick = showQueue;
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', () => next());
  navigator.mediaSession.setActionHandler('previoustrack', prev);
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight' && e.shiftKey) next();
  if (e.code === 'ArrowLeft' && e.shiftKey) prev();

function showAlbum(a, tr) {
  if (S.view !== 'libre') return;
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${esc(a.title)} · ${esc(a.artist)}</h2>${trackList(tr)}`;
  main.querySelector('.view').insertBefore(sec, main.querySelector('.view').children[1]);
  markPlaying();
}

go('inicio');
</script>
